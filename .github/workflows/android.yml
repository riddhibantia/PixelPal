name: Android CI

# Full Android build matrix: debug APK, JVM unit tests, and a minified
# (R8 + resource-shrunk) release APK. The release artifact is UNSIGNED unless
# the repository defines the signing secrets listed in RELEASING.md — no
# secrets are ever committed here.

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# A newer push to the same ref cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.jvmargs=-Xmx4g
    -Dorg.gradle.daemon=false
    -Dkotlin.daemon.jvm.options=-Xmx2g

jobs:
  # ---------------------------------------------------------------------
  # Debug build + unit tests
  # ---------------------------------------------------------------------
  debug:
    name: Debug build + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Create local.properties (CI stub)
        # GEMINI_API_KEY is optional; an empty/stub value makes BuildConfig
        # carry a non-usable key and the app falls back to local dialogue.
        run: echo "GEMINI_API_KEY=ci-stub-not-a-real-key" > local.properties

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixelpal-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------
  # Minified release build (R8 + resource shrinking)
  # ---------------------------------------------------------------------
  release:
    name: Release build (minified, R8)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: debug
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Create local.properties (CI stub)
        run: echo "GEMINI_API_KEY=ci-stub-not-a-real-key" > local.properties

      # ---- Optional signing (only when secrets are configured) ----------
      # Uncomment when the four RELEASE_* secrets from RELEASING.md exist;
      # the keystore is written to the runner's temp dir, never to the repo.
      #
      # - name: Decode keystore
      #   if: ${{ secrets.RELEASE_STORE_BASE64 != '' }}
      #   run: |
      #     echo "${{ secrets.RELEASE_STORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/pixelpal.jks"
      #     echo "RELEASE_STORE_FILE=$RUNNER_TEMP/pixelpal.jks" >> "$GITHUB_ENV"
      #     echo "RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}" >> "$GITHUB_ENV"
      #     echo "RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}" >> "$GITHUB_ENV"
      #     echo "RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}" >> "$GITHUB_ENV"
      # ------------------------------------------------------------------

      - name: Assemble release APK (unsigned R8 pre-check)
        # `build.gradle.kts` refuses to build a release without an explicit
        # version and signing config, so CI opts into the pre-check mode: this
        # still exercises R8 minification + resource shrinking, but produces an
        # unsigned, git-derived version that is never published.
        run: >
          ./gradlew :app:assembleRelease
          -PPIXELPAL_RELEASE_PRECHECK=true
          --stacktrace --no-daemon

      - name: Verify release APK exists
        run: |
          ls -la app/build/outputs/apk/release/
          test -n "$(ls app/build/outputs/apk/release/*.apk 2>/dev/null)" \
            || (echo "::error::assembleRelease produced no APK" && exit 1)

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: pixelpal-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload R8 mapping + usage (for crash deobfuscation)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-mapping
          path: app/build/outputs/mapping/release/
          if-no-files-found: ignore
          retention-days: 30
