# 4 GB: R8 on a Compose + Firebase release build transits well past 2 GB.
# With -Xmx2048m minifyReleaseWithR8 threw
# "java.util.ConcurrentModificationException" on CI and ground for 25+ minutes
# locally. The extra headroom is the fix, not a workaround: R8's own thread
# pools race when the heap is exhausted.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
android.suppressUnsupportedCompileSdk=35
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.enableJetifier=true
org.gradle.parallel=true
org.gradle.caching=true

# Release signing (keystore path + credentials). Leave blank for unsigned debug builds.
RELEASE_STORE_FILE=
RELEASE_STORE_PASSWORD=
RELEASE_KEY_ALIAS=
RELEASE_KEY_PASSWORD=
